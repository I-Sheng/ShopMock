<!-- ShopMock's container-only Wazuh collector.
     This intentionally monitors Podman-owned journals and mounted deployment
     files, not the Ubuntu host's package/process/security posture. -->
<ossec_config>
  <client>
    <server>
      <address>CHANGE_MANAGER_IP</address>
      <port>CHANGE_MANAGER_PORT</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>linux,container,podman,shopmock</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>CHANGE_ENROLL_IP</manager_address>
      <port>CHANGE_ENROLL_PORT</port>
      <agent_name>CHANGE_AGENT_NAME</agent_name>
      <authorization_pass_path>etc/authd.pass</authorization_pass_path>
      <groups>CHANGE_AGENT_GROUP</groups>
    </enrollment>
  </client>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>200</events_per_second>
  </client_buffer>

  <!-- Host posture checks would describe this collector image, not Ubuntu. -->
  <rootcheck>
    <disabled>yes</disabled>
  </rootcheck>
  <wodle name="syscollector">
    <disabled>yes</disabled>
  </wodle>
  <sca>
    <enabled>no</enabled>
  </sca>

  <!-- Track deployment/configuration changes without collecting file contents. -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <directories realtime="yes" check_all="yes">/host/shopmock</directories>
    <ignore>/host/shopmock/.env</ignore>
    <ignore>/host/shopmock/.git</ignore>
    <ignore>/host/shopmock/.hermes</ignore>
    <ignore type="sregex">/__pycache__/|/node_modules/|\.pyc$|\.log$|\.swp$</ignore>
    <nodiff>/host/shopmock/.env</nodiff>
    <process_priority>10</process_priority>
    <max_eps>20</max_eps>
    <synchronization>
      <enabled>yes</enabled>
      <interval>5m</interval>
      <max_eps>10</max_eps>
    </synchronization>
  </syscheck>

  <!-- The rootless journal relay emits selected Podman entries as JSON. -->
  <localfile>
    <location>/var/log/podman/podman-journal.json</location>
    <log_format>json</log_format>
  </localfile>

  <logging>
    <log_format>plain</log_format>
  </logging>
</ossec_config>

<ossec_config>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/active-responses.log</location>
  </localfile>
</ossec_config>